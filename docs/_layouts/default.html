<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <div class="wrap">
      {% include site-nav.html %}
      <main class="content">
        {{ content }}
      </main>
    </div>
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
      // Kramdown が <pre><code class="language-mermaid"> に変換するため
      // Mermaid が認識できる <pre class="mermaid"> に変換する
      document.querySelectorAll('pre code.language-mermaid').forEach(code => {
        const pre = code.parentElement;
        const div = document.createElement('pre');
        div.className = 'mermaid';
        div.textContent = code.textContent;
        pre.replaceWith(div);
      });
      // pandoc 変換は <pre class="mermaid"><code> を出力するため code を剥がす
      document.querySelectorAll('pre.mermaid > code').forEach(code => {
        code.parentElement.textContent = code.textContent;
      });
      mermaid.initialize({ startOnLoad: true });
    </script>
  </body>
</html>
